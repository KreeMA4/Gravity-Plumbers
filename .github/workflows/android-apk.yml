# Builds an installable DEBUG APK of Gravity Plumbers with Godot 4.6.
# Order: static checks -> Godot import -> logic tests -> smoke tests (headless
# + real OpenGL rendering) -> physics soak test -> Android export -> APK
# verification -> upload -> re-download and check the artifact. Any failing step
# stops the pipeline. Every APK carries this run's number: in its file name
# (GravityPlumbers-Android-Debug-RunN.apk), its Android versionName (x.y.z-runN),
# its versionCode (N) and on the game's main menu ("CI run N (commit)").
# Debug signing keys are generated fresh on every run and never committed.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/gravity-plumbers-godot-fujx19
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "dist/**"
      - "LICENSE"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6"
  GODOT_STATUS: "stable"
  BUILD_RUN: ${{ github.run_number }}
  APK_NAME: GravityPlumbers-Android-Debug-Run${{ github.run_number }}.apk

jobs:
  build-android:
    name: Check, test and export APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- tools
      - name: Set up Python (validator + GDScript parser)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17 (required by Godot 4.6 Android export)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-v1

      - name: Download Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl && cd ~/godot-dl
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fsSL --retry 4 -o editor.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl -fsSL --retry 4 -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          ls -la

      - name: Install Godot and the matching export templates
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          unzip -o -q ~/godot-dl/editor.zip
          mv -f Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 godot
          chmod +x godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mkdir -p "$TPL"
          unzip -o -q ~/godot-dl/templates.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$TPL/"
          echo "Templates version: $(cat "$TPL/version.txt")"
          test "$(cat "$TPL/version.txt")" = "${GODOT_VERSION}.${GODOT_STATUS}"
          ls "$TPL" | grep android
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"
          ~/godot/godot --version

      - name: Generate temporary debug keystore + editor settings
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/debug.keystore"
          # Standard Android debug credentials, made fresh for this run only (never committed).
          keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${KS}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
            sed -i 's/^          //' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      # ---------------------------------------------------------- build stamp
      - name: Stamp this run into the build (run ${{ github.run_number }})
        id: stamp
        # Before any test, so every check below runs on exactly what gets exported.
        run: |
          set -euo pipefail
          python3 tools/ci/stamp_build.py "$BUILD_RUN" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
          cat scripts/core/build_info.gd
          grep -E "^version/(code|name)=" export_presets.cfg

      # --------------------------------------------------------- static checks
      - name: Static checks (project validator + full GDScript parse)
        run: |
          echo "## Gravity Plumbers CI" >> "$GITHUB_STEP_SUMMARY"
          pip install --quiet "gdtoolkit==4.*"
          python3 tools/validate_project.py
          echo "- **static validation + gdtoolkit parse**: PASS" >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------------- Godot
      - name: Godot headless import
        run: >
          python3 tools/ci/run_godot.py --name "Godot import" --log ci_logs/import.log --timeout 900 --
          "$GODOT" --headless --path . --import

      - name: Logic tests (tests/run_all.gd)
        run: >
          python3 tools/ci/run_godot.py --name "logic tests" --log ci_logs/tests.log --timeout 300
          --expect "^[1-9][0-9]* passed, 0 failed" --
          "$GODOT" --headless --path . -s res://tests/run_all.gd

      - name: Headless smoke tests (boot every screen and level)
        run: |
          set -uo pipefail
          FAILED=0
          run() {  # name, expect-regex, user args...
            local name="$1"; local expect="$2"; shift 2
            python3 tools/ci/run_godot.py --quiet --name "smoke: $name" --log "ci_logs/smoke_${name}.log" --timeout 300 \
              --expect "$expect" -- "$GODOT" --headless --verbose --path . --fixed-fps 60 --quit-after 5000 -- --ci-quit-frames=600 "$@" || FAILED=1
          }
          # The main menu boot must also log this run's build stamp.
          python3 tools/ci/run_godot.py --quiet --show "starting on" --name "smoke: main_menu" --log ci_logs/smoke_main_menu.log --timeout 300 \
            --expect "Screen -> main_menu" --expect "\\[CI run ${BUILD_RUN} \\(" -- \
            "$GODOT" --headless --verbose --path . --fixed-fps 60 --quit-after 5000 -- --ci-quit-frames=600 || FAILED=1
          for s in gravity_test look_test playground customize settings host_join tests; do
            run "$s" "Screen -> $s" "--screen=$s"
          done
          for l in hub bathroom cafeteria waterworks spincycle reactor workshop; do
            run "level_$l" "Level built" "--level=$l"
          done
          exit $FAILED

      - name: Physics soak test (4 plumbers, random gravity, 2 min simulated)
        run: >
          python3 tools/ci/run_godot.py --quiet --show "Soak" --name "physics soak test" --log ci_logs/soak.log --timeout 1200
          --expect "Soak test .*PASSED" --
          "$GODOT" --headless --verbose --path . --fixed-fps 60 -- --soak

      - name: Rendered smoke tests (real OpenGL via Mesa, compiles shaders, screenshots)
        # The CI machine has no sound card, so audio uses Godot's Dummy driver here.
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p ci_screens
          FAILED=0
          shot() {  # name, user args...
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/ci/run_godot.py --quiet --name "render: $name" \
              --log "ci_logs/render_${name}.log" --timeout 600 --expect "CI screenshot saved" -- \
              "$GODOT" --verbose --path . --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 60 --quit-after 5000 -- --ci-quit-frames=420 \
              "--ci-screenshot=$PWD/ci_screens/$name.png" --ci-frames=360 "$@" || FAILED=1
          }
          shot main_menu
          shot look_test --screen=look_test
          shot playground --screen=playground
          for l in hub bathroom cafeteria waterworks spincycle reactor workshop; do
            shot "level_$l" "--level=$l"
          done
          exit $FAILED

      - name: Touch input end-to-end test (Android touch events in a gameplay screen)
        # Drives the real game with InputEventScreenTouch/Drag (what an Android phone sends):
        # joystick visible + on screen at several resolutions, plumber moves in all 8 directions
        # relative to the camera, analog, no conflict with look/Jump/Grab, keyboard still works.
        run: >
          xvfb-run -a -s "-screen 0 2560x1440x24" python3 tools/ci/run_godot.py --quiet --show "^  (ok|FAIL|shot)|TOUCH E2E" --name "touch input e2e"
          --log ci_logs/touch_e2e.log --timeout 600 --expect "TOUCH E2E PASSED" --
          "$GODOT" --verbose --path . --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 60
          -s res://tests/touch_e2e_test.gd -- --shots=$PWD/ci_screens

      - name: Gameplay end-to-end test (pickup, grabs, tools, walk/run/jump/fall, ragdoll, gravity)
        # Real physics in the Ragdoll Playground: deliberate pickup only, Grab L/R still
        # work, feet touch the ground and don't skate, walk -> run, stops, jump/land,
        # ragdoll recovery, walking on a wall and the ceiling. Saves anim_* screenshots.
        run: >
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/ci/run_godot.py --quiet --show "^  (ok|FAIL|shot|info|failed)|GAMEPLAY E2E" --name "gameplay e2e"
          --log ci_logs/gameplay_e2e.log --timeout 900 --expect "GAMEPLAY E2E PASSED" --
          "$GODOT" --verbose --path . --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 60
          -s res://tests/gameplay_e2e_test.gd -- --shots=$PWD/ci_screens

      # -------------------------------------------------------------- export
      - name: Export Android debug APK (fresh, this run only)
        run: |
          set -euo pipefail
          # Start from an empty build/ so no older APK can be picked up, and prove the
          # file was written by this export (newer than a marker made just before it).
          rm -rf build && mkdir -p build
          test -z "$(ls -A build)"
          touch "$RUNNER_TEMP/export_start"
          sleep 1
          python3 tools/ci/run_godot.py --name "Android export" --log ci_logs/export.log --timeout 900 -- \
            "$GODOT" --headless --path . --export-debug "Android" "build/${APK_NAME}"
          test -s "build/${APK_NAME}" || { echo "export produced no APK"; exit 1; }
          [ "build/${APK_NAME}" -nt "$RUNNER_TEMP/export_start" ] || { echo "APK is older than this export"; exit 1; }
          [ "$(ls build/*.apk | wc -l)" -eq 1 ] || { echo "more than one APK in build/: $(ls build)"; exit 1; }
          ls -la --time-style=full-iso build

      - name: Verify APK (signature, arm64, package, permissions, landscape, this run's version)
        env:
          EXPECT_VERSION_CODE: ${{ steps.stamp.outputs.version_code }}
          EXPECT_VERSION_NAME: ${{ steps.stamp.outputs.version_name }}
        run: bash tools/ci/verify_apk.sh "build/${APK_NAME}"

      - name: Checksum + build info
        id: sum
        run: |
          set -euo pipefail
          cd build
          SHA=$(sha256sum "${APK_NAME}" | cut -d" " -f1)
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          {
            echo "Gravity Plumbers debug APK"
            echo "file:          ${APK_NAME}"
            echo "sha256:        ${SHA}"
            echo "size_bytes:    $(stat -c %s "${APK_NAME}")"
            echo "versionName:   ${{ steps.stamp.outputs.version_name }}"
            echo "versionCode:   ${{ steps.stamp.outputs.version_code }}"
            echo "in-game label: ${{ steps.stamp.outputs.label }}"
            echo "run:           #${BUILD_RUN} (attempt ${GITHUB_RUN_ATTEMPT}) ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit:        ${GITHUB_SHA}"
            echo "branch:        ${GITHUB_REF_NAME}"
            echo "built_utc:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK SHA-256 (run ${BUILD_RUN})::${APK_NAME} ${SHA}"

      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            build/${{ env.APK_NAME }}
            build/${{ env.APK_NAME }}.sha256
            build/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Re-download the artifact and check its contents
        # Proves what a phone will download is exactly this run's APK.
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/artifact-check

      - name: Verify artifact contents + report SHA-256
        env:
          EXPECT_SHA: ${{ steps.sum.outputs.sha256 }}
          EXPECT_VERSION_CODE: ${{ steps.stamp.outputs.version_code }}
          EXPECT_VERSION_NAME: ${{ steps.stamp.outputs.version_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ZIP_SHA: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/artifact-check"
          ls -la "$D"
          # Exactly: the APK, its .sha256 and BUILD_INFO.txt; exactly one APK, named for this run.
          [ "$(ls "$D" | sort | tr '\n' ' ')" = "$(printf '%s\n' "${APK_NAME}" "${APK_NAME}.sha256" BUILD_INFO.txt | sort | tr '\n' ' ')" ] \
            || { echo "artifact contents are not what was uploaded: $(ls "$D")"; exit 1; }
          [ "$(ls "$D"/*.apk | wc -l)" -eq 1 ]
          GOT=$(sha256sum "$D/${APK_NAME}" | cut -d" " -f1)
          [ "$GOT" = "$EXPECT_SHA" ] || { echo "downloaded APK sha256 $GOT != built $EXPECT_SHA"; exit 1; }
          (cd "$D" && sha256sum -c "${APK_NAME}.sha256")
          grep -q "$EXPECT_SHA" "$D/BUILD_INFO.txt"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          "$BT/aapt" dump badging "$D/${APK_NAME}" | grep -q "versionCode='${EXPECT_VERSION_CODE}' versionName='${EXPECT_VERSION_NAME}'" \
            || { echo "downloaded APK is not this run's version"; exit 1; }
          {
            echo "### APK for run #${BUILD_RUN}"
            echo "- Artifact: [\`${APK_NAME}\`](${ARTIFACT_URL}) (contains the APK, \`${APK_NAME}.sha256\`, \`BUILD_INFO.txt\`)"
            echo "- APK SHA-256: \`${GOT}\`"
            echo "- Artifact zip digest: \`${ARTIFACT_ZIP_SHA}\`"
            echo "- Android versionName \`${EXPECT_VERSION_NAME}\`, versionCode \`${EXPECT_VERSION_CODE}\`; main menu shows \`${{ steps.stamp.outputs.label }}\`"
            echo "- Re-downloaded and checked: contents, SHA-256 and version all match this run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT OK: ${APK_NAME} sha256=${GOT}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshots
          path: ci_screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            ci_logs/
            ~/.local/share/godot/app_userdata/Gravity Plumbers/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Screenshot report (exposure stats + thumbnails in the log)
        if: always()
        env:
          THUMBS: legs_idle,legs_walk_a,legs_walk_b,legs_stopped,level_waterworks,anim_walk,anim_run,pickup_prompt
        run: |
          pip install --quiet pillow
          ls ci_screens/*.png > /dev/null 2>&1 && python3 tools/ci/thumbs.py ci_screens/*.png || echo "no screenshots"
          # Test summaries last, so the end of the log has everything needed to debug.
          for f in ci_logs/touch_e2e.log ci_logs/gameplay_e2e.log; do
            [ -f "$f" ] && grep -E "^  (FAIL|info)|E2E: [0-9]+ checks" "$f" | sed "s|^|$(basename $f): |" | tail -60 || true
          done
